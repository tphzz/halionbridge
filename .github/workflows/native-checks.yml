name: 90 Helper - Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    concurrency:
      group: native-x64-host
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
        working-directory: .ci/${{ github.run_id }}-${{ github.run_attempt }}-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .ci/${{ github.run_id }}-${{ github.run_attempt }}-checks
      - name: Prepare pinned actionlint for this job
        run: |
          set -euo pipefail
          tools_dir="$PWD/build-ci/tools"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          chmod +x "$tools_dir/actionlint"
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"
      - name: Validate workflows and release tools
        run: |
          set -euo pipefail
          python3 --version
          actionlint -version
          python3 -B packaging/ci/lint.py
          python3 -B -m unittest discover -s packaging/ci/tests -v
      - name: Clean owned checkout
        if: always()
        working-directory: .
        run: |
          helper=".ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-checks/packaging/ci/cleanup.py"
          if [ -f "$helper" ]; then python3 -B "$helper" checks; fi
